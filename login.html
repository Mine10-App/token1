<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Login</title>
  <script src="pass.js"></script> <!-- Link to password file -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      overflow: hidden;
    }
    
    .login-header {
      background: linear-gradient(to right, #1a73e8, #0d47a1);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .login-header h2 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    .login-header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }
    
    .login-body {
      padding: 40px 30px;
    }
    
    .form-group {
      margin-bottom: 25px;
      position: relative;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 1rem;
    }
    
    .form-input {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      transition: all 0.3s;
      background: #f8f9fa;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #1a73e8;
      background: white;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
    }
    
    .login-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
      margin-top: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .login-btn:hover {
      background: #0d47a1;
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
    }
    
    .login-btn:active {
      transform: translateY(0);
    }
    
    .input-icon {
      position: absolute;
      right: 15px;
      top: 42px;
      color: #6c757d;
      font-size: 1.2rem;
    }
    
    .password-toggle {
      position: absolute;
      right: 15px;
      top: 42px;
      background: none;
      border: none;
      color: #6c757d;
      cursor: pointer;
      font-size: 1.2rem;
    }
    
    .error-message {
      color: #f44336;
      text-align: center;
      margin-top: 15px;
      font-weight: 500;
      min-height: 24px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .error-message.show {
      opacity: 1;
    }
    
    .hospital-info {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      color: #6c757d;
    }
    
    .hospital-info h3 {
      color: #1a73e8;
      margin-bottom: 10px;
    }
    
    /* Animation for form */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .login-body {
      animation: fadeIn 0.5s ease-out;
    }
    
    /* Responsive adjustments */
    @media (max-width: 500px) {
      .login-container {
        max-width: 100%;
      }
      
      .login-body {
        padding: 30px 20px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h2>Doctor Login</h2>
      <p>Access your token management panel</p>
    </div>
    
    <div class="login-body">
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="doctorName">Doctor Name</label>
          <input type="text" id="doctorName" class="form-input" placeholder="Enter your full name" required>
          <i class="fas fa-user input-icon"></i>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="roomNo">Room Number</label>
          <input type="text" id="roomNo" class="form-input" placeholder="Enter your room number" required>
          <i class="fas fa-door-closed input-icon"></i>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" id="togglePassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        
        <button type="submit" class="login-btn">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
        
        <div class="error-message" id="errorMessage"></div>
      </form>
      
      <div class="hospital-info">
        <h3>Hospital Token System</h3>
        <p>Secure access for medical staff only</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      let doctorName = document.getElementById("doctorName").value.trim();
      let roomNo = document.getElementById("roomNo").value.trim();
      let password = document.getElementById("password").value;
      let errorMessage = document.getElementById("errorMessage");

      // Use GENERAL_PASSWORD from pass.js
      if(password === GENERAL_PASSWORD){
        // Clear any previous error
        errorMessage.textContent = "";
        errorMessage.classList.remove("show");
        
        // Save session info
        localStorage.setItem("doctorName", doctorName);
        localStorage.setItem("roomNo", roomNo);

        // Redirect to call page
        window.location.href = "call.html";
      } else {
        errorMessage.textContent = "Invalid password. Access denied.";
        errorMessage.classList.add("show");
      }
    });

    // Toggle password visibility
    document.getElementById("togglePassword").addEventListener("click", function() {
      const passwordInput = document.getElementById("password");
      const icon = this.querySelector("i");
      
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passwordInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    });

    // Clear error when user starts typing
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('input', function() {
        document.getElementById('errorMessage').classList.remove('show');
      });
    });
  </script>
</body>
</html>
