<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Login</title>
</head>
<body>
  <h2>Doctor Login</h2>
  <form id="loginForm">
    <input type="text" id="doctorName" placeholder="Doctor Name" required><br>
    <input type="text" id="roomNo" placeholder="Room Number" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>

  <script>
    // 🔑 General password for all doctors
    const GENERAL_PASSWORD = "hospital123";

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      let doctorName = document.getElementById("doctorName").value.trim();
      let roomNo = document.getElementById("roomNo").value.trim();
      let password = document.getElementById("password").value;

      if(password === GENERAL_PASSWORD){
        // Save session info
        localStorage.setItem("doctorName", doctorName);
        localStorage.setItem("roomNo", roomNo);

        // Redirect to call page
        window.location.href = "call.html";
      } else {
        alert("Invalid password. Access denied.");
      }
    });
  </script>
</body>
</html>
