<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hospital Token Display</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="fire.js"></script>
  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    h1 { text-align:center; margin: 20px 0; }

    .container { display: flex; height: 100vh; }

    /* Left: Token display (1/3) */
    .token-area {
      width: 33.33%;
      background: #f8f8f8;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
    }

    .room-card {
      width: 90%;
      min-height: 120px; /* flexible for bigger tokens */
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px;
      transition: all 0.3s;
      overflow: hidden;
      position: relative;
    }

    .room-no { font-weight: bold; color: #333; }
    .doctor { color: #555; margin-top: 5px; }
    .token {
      font-weight: bold;
      color: #1a73e8;
      margin-top: 5px;
      position: relative;
      display: inline-block;
      word-wrap: break-word;
    }
    .recall { color: red; font-size: 1em; margin-top: 3px; display: block; }

    /* Flash animations */
    .pulse-next { animation: pulseNext 3s ease-in-out; }
    .pulse-recall { animation: pulseRecall 3s ease-in-out; }

    @keyframes pulseNext {
      0% { transform: scale(1); background-color: #fff200; }
      50% { transform: scale(1.05); background-color: #ffffff; }
      100% { transform: scale(1); background-color: #fff200; }
    }

    @keyframes pulseRecall {
      0% { transform: scale(1); background-color: #ff4d4d; }
      50% { transform: scale(1.05); background-color: #ffffff; }
      100% { transform: scale(1); background-color: #ff4d4d; }
    }

    .slide-in { animation: slideInAnim 0.5s ease-out; }
    @keyframes slideInAnim {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    /* Right: Ads (2/3) */
    .ads-area {
      width: 66.66%;
      background: black;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ads-area img, .ads-area video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .ads-area img.active, .ads-area video.active { opacity: 1; }

    /* Start overlay to unlock audio */
    #startOverlay {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      color: white;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size: 28px;
      text-align:center;
      z-index:1000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Hospital Token System</h1>

  <div id="startOverlay">Click anywhere to start display & enable sound</div>

  <div class="container" id="mainContainer" style="display:none;">
    <div class="token-area" id="displayArea"></div>
    <div class="ads-area" id="adsArea"></div>
  </div>

  <audio id="notifSound" src="notification.mp3" preload="auto"></audio>

  <script>
    const db = firebase.database();
    const displayArea = document.getElementById("displayArea");
    const notifSound = document.getElementById("notifSound");
    const startOverlay = document.getElementById("startOverlay");
    const mainContainer = document.getElementById("mainContainer");
    let previousTokens = {};

    // Click to start
    startOverlay.addEventListener("click", () => {
      mainContainer.style.display = "flex";
      startOverlay.style.display = "none";

      // Unlock audio by playing/pause
      notifSound.play().then(() => notifSound.pause());
    });

    function updateDisplay(snapshot){
      displayArea.innerHTML = "";
      const roomsCount = snapshot.numChildren();
      if(roomsCount === 0) return;

      snapshot.forEach(roomSnap => {
        const data = roomSnap.val();
        const card = document.createElement("div");
        card.className = "room-card";

        // Auto font size based on token digits
        let tokenFontSize = 60;
        if(data.token >= 10) tokenFontSize = 50;
        if(data.token >= 100) tokenFontSize = 40;

        card.innerHTML = `
          <div class="room-no" style="font-size:30px;">Room ${data.roomNo}</div>
          <div class="doctor" style="font-size:18px;">${data.doctor || ''}</div>
          <div class="token" style="font-size:${tokenFontSize}px;">Token ${data.token || 0}</div>
          ${data.recall ? `<span class="recall">Recall</span>` : ''}
        `;

        displayArea.appendChild(card);
        const tokenDiv = card.querySelector(".token");

        if(previousTokens[data.roomNo] !== undefined && previousTokens[data.roomNo] !== data.token){
          // Play sound
          notifSound.currentTime = 0;
          notifSound.play().catch(e => console.log("Audio blocked"));

          // Flash color
          if(data.recall) card.classList.add("pulse-recall");
          else card.classList.add("pulse-next");

          tokenDiv.classList.add("slide-in");

          setTimeout(() => {
            card.classList.remove("pulse-next");
            card.classList.remove("pulse-recall");
          }, 3000);

          setTimeout(() => tokenDiv.classList.remove("slide-in"), 500);
        }

        previousTokens[data.roomNo] = data.token;
      });
    }

    db.ref("tokens").on("value", snapshot => updateDisplay(snapshot));

    // Ads setup
    const ads = [
      {type:"image", src:"ad1.jpg"},
      {type:"image", src:"ad2.jpg"},
      {type:"video", src:"ad3.mp4"}
    ];
    const adsArea = document.getElementById("adsArea");

    ads.forEach((ad, index) => {
      let el = ad.type==="image"? document.createElement("img") : document.createElement("video");
      if(ad.type==="video"){ el.muted=true; el.loop=true; el.autoplay=true; }
      el.src = ad.src;
      if(index===0) el.classList.add("active");
      adsArea.appendChild(el);
    });

    let currentAd=0;
    setInterval(() => {
      const elements = adsArea.querySelectorAll("img,video");
      elements.forEach(el=>el.classList.remove("active"));
      currentAd = (currentAd+1) % elements.length;
      elements[currentAd].classList.add("active");
      if(elements[currentAd].tagName==="VIDEO") elements[currentAd].play();
    }, 5000);
  </script>
</body>
</html>
