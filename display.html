<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Token Display</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="fire.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
}

/* Main container */
.main-container {
  display: flex;
  flex: 1;
  width: 100%;
}

/* Left panel (token & banner) */
.left-panel {
  width: 40%;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-right: 3px solid #1a73e8;
}

/* Banner area */
.banner-area {
  padding: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.banner-area img { 
  width: 100%; 
  height: 120px; 
  object-fit: cover; 
  border-radius: 8px;
}

/* Token area */
.token-area { 
  flex: 1;
  background: #ffffff; 
  padding: 15px; 
  display: flex; 
  flex-direction: column; 
  gap: 15px; 
  overflow-y: auto; 
}

/* Right panel (ads) */
.ads-area { 
  width: 60%; 
  background: #000; 
  position: relative; 
  overflow: hidden; 
}
.ad-content { 
  position: absolute; 
  width: 100%; 
  height: 100%; 
  object-fit: contain; 
  opacity: 0; 
  transition: opacity 1s ease-in-out; 
}
.ad-content.active { opacity: 1; }

/* Room card */
.room-card {
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  padding: 15px; 
  background: #e3f2fd;
  border-radius: 12px; 
  border-left: 5px solid #1a73e8; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  height: 100px; 
  position: relative; 
  transition: all 0.3s; 
}
.room-info { display: flex; flex-direction: column; flex: 1; }
/* Room number slightly bigger */
.room-no { font-weight: bold; font-size: 2rem; color: #1a73e8; }
/* Token number remains the same */
.token { 
  font-weight: bold; 
  color: #1a73e8; 
  font-size: 3rem;  
  min-width: 80px; 
  text-align: center; 
  text-shadow: 1px 1px 3px rgba(0,0,0,0.2); 
}

/* Doctor name */
.doctor { font-style: italic; color: #555; font-size: 1rem; }

/* Recall badge moved slightly right */
.recall { 
  display: inline-block; 
  background: #ff4d4d; 
  color: white; 
  padding: 5px 12px; 
  border-radius: 20px; 
  font-weight: bold; 
  font-size: 1rem; 
  position: absolute;
  top: 50%;
  left: 60%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

/* Smooth sway + blink + glow */
.sway-card {
  animation: swayGlow 1s ease-in-out 0s 5; 
}
@keyframes swayGlow {
  0%,100% { transform: translateX(0); background: #e3f2fd; box-shadow: 0 4px 10px rgba(0,0,0,0.15);}
  25% { transform: translateX(-10px); background: #fff9c4; box-shadow: 0 6px 15px rgba(255,204,0,0.6);}
  50% { transform: translateX(10px); background: #fff9c4; box-shadow: 0 6px 15px rgba(255,204,0,0.6);}
  75% { transform: translateX(-10px); background: #fff9c4; box-shadow: 0 6px 15px rgba(255,204,0,0.6);}
}

/* Blink token number only */
.blink-number {
  animation: blinkColor 1s ease-in-out 0s 5;
}
@keyframes blinkColor {
  0%,100% { color: #1a73e8; }
  50% { color: #ff6600; }
}

/* Audio control */
.audio-control { 
  position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; 
  border-radius: 50%; background: #1a73e8; color: white; border: none; 
  font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
  z-index: 1000; 
}
.audio-control:hover { transform: scale(1.1); }
.audio-control.muted { background:#ff4d4d; }

/* Start overlay */
#startOverlay { 
  position: fixed; top:0; left:0; width:100%; height:100%; 
  background: rgba(0,0,0,0.92); color:white; display:flex; 
  flex-direction:column; justify-content:center; align-items:center; 
  font-size:2rem; text-align:center; z-index:2000; cursor:pointer; 
}
.overlay-content { max-width: 600px; padding: 30px; }
.overlay-content h2 { font-size: 3rem; margin-bottom: 20px; color: #1a73e8; }
.overlay-content p { font-size: 1.5rem; margin-bottom: 30px; }
.start-button { 
  background:#1a73e8; color:white; border:none; padding:15px 40px; 
  font-size:1.5rem; border-radius:50px; cursor:pointer; 
}
.start-button:hover { background: #1557b0; }

/* Responsive */
@media (max-width: 1024px) {
  .main-container { flex-direction: column; }
  .left-panel, .ads-area { width: 100%; }
  .token-area { height: 40vh; flex-direction: row; overflow-x: auto; gap: 10px; }
  .room-card { min-width: 280px; height: 120px; }
  .ads-area { height: 50vh; }
}
@media (max-width: 768px) {
  .room-no { font-size: 1.8rem; } /* Slightly smaller for mobile */
  .token { font-size: 3rem; }   /* Token remains same */
  .overlay-content h2 { font-size: 2.2rem; }
}
</style>
</head>
<body>

<div id="startOverlay">
  <div class="overlay-content">
    <h2>Hospital Token System</h2>
    <p>Click below to start the display and enable notification sounds</p>
    <button class="start-button">Start Display</button>
  </div>
</div>

<div class="main-container" id="mainContainer" style="display:none;">
  <div class="left-panel">
    <div class="banner-area">
      <img src="LOGOFAROOK1.jpg" alt="Hospital Logo">
    </div>
    <div class="token-area" id="displayArea"></div>
  </div>
  <div class="ads-area" id="adsArea"></div>
</div>

<button class="audio-control" id="audioToggle">🔊</button>
<audio id="notifSound" src="Ding.mp3" preload="auto"></audio>

<script>
const displayArea=document.getElementById("displayArea");
const notifSound=document.getElementById("notifSound");
const startOverlay=document.getElementById("startOverlay");
const mainContainer=document.getElementById("mainContainer");
const audioToggle=document.getElementById("audioToggle");
let previousTokens={};
let audioEnabled=false;
let db;

document.addEventListener('DOMContentLoaded',function(){
  if(typeof firebase!=='undefined' && firebase.apps.length>0){
    db=firebase.database();
    db.ref("tokens").on("value", snapshot=>updateDisplay(snapshot));
  }
});

document.querySelector('.start-button').addEventListener('click',()=>{ 
  startOverlay.style.display="none";
  mainContainer.style.display="flex";
  audioToggle.style.display="block";
  enableAudio();
});

audioToggle.addEventListener('click',()=>{
  audioEnabled=!audioEnabled;
  audioToggle.textContent=audioEnabled?"🔊":"🔇";
  audioToggle.classList.toggle('muted',!audioEnabled);
  if(audioEnabled) playNotificationSound();
});

function enableAudio(){
  const silentAudio=new Audio();
  silentAudio.src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA";
  silentAudio.volume=0;
  silentAudio.play().then(()=>{ audioEnabled=true; audioToggle.textContent="🔊"; }).catch(()=>{ audioEnabled=false; audioToggle.textContent="🔇"; audioToggle.classList.add('muted'); });
}

function playNotificationSound(){
  if(!audioEnabled) return;
  notifSound.currentTime=0; notifSound.play().catch(()=>{});
}

function updateDisplay(snapshot){
  displayArea.innerHTML='';
  if(!snapshot.exists()){
    displayArea.innerHTML+=`
      <div class="room-card">
        <div class="room-info">
          <div class="room-no">No Active Tokens</div>
          <div class="doctor">Please wait</div>
        </div>
        <div class="token">-</div>
      </div>`;
    return;
  }

  snapshot.forEach(roomSnap=>{
    const data=roomSnap.val();
    const card=document.createElement("div"); 
    card.className="room-card";

    card.innerHTML=`
      <div class="room-info">
        <div class="room-no">Room ${data.roomNo}</div>
        <div class="doctor">Dr. ${data.doctor||'Available'}</div>
      </div>
      <div class="token">${data.token||0}</div>
      ${data.recall?'<span class="recall">Recall</span>':''}`;

    displayArea.appendChild(card);

    const tokenChanged = previousTokens[data.roomNo] === undefined || previousTokens[data.roomNo].token !== data.token;
    const recallActivated = data.recall && (previousTokens[data.roomNo] === undefined || !previousTokens[data.roomNo].recall);

    if(tokenChanged || recallActivated){
      playNotificationSound();
      card.classList.add("sway-card");
      const tokenDiv = card.querySelector(".token");
      tokenDiv.classList.add("blink-number");  // only token blinks

      setTimeout(()=>{
        card.classList.remove("sway-card");
        tokenDiv.classList.remove("blink-number");
      },5000);
    }

    previousTokens[data.roomNo]={token:data.token,recall:data.recall||false};
  });
}

// Ads
const ads = [];
for(let i=1;i<=17;i++){ ads.push({src:`Slide${i}.jpg`}); }
const adsArea=document.getElementById("adsArea");
ads.forEach((ad,index)=>{
  let el=document.createElement("img");
  el.className="ad-content";
  el.src=ad.src;
  if(index===0) el.classList.add("active");
  adsArea.appendChild(el);
});
let currentAd=0;
setInterval(()=>{
  const elements=adsArea.querySelectorAll(".ad-content");
  elements.forEach(el=>el.classList.remove("active"));
  currentAd=(currentAd+1)%elements.length;
  elements[currentAd].classList.add("active");
},6000);
</script>
</body>
</html>
