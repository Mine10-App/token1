<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Token Display</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="fire.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
  min-height: 100vh; overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* Main container - tokens & banner on left (1/3), ads on right (2/3) */
.main-container {
  display: flex;
  flex: 1;
  max-width: 1800px;
  margin: 0 auto;
  width: 100%;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
}

/* Left side - tokens and banner (1/3 of window) */
.left-panel {
  width: 33.33%;
  display: flex;
  flex-direction: column;
  background: rgba(255, 255, 255, 0.95);
  border-right: 3px solid #1a73e8;
}

/* Banner section */
.banner-area {
  padding: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-bottom: 2px solid #e0e0e0;
}
.banner-container img { 
  height: 100px; 
  width: auto; 
  margin-bottom: 10px;
}

/* Token area */
.token-area { 
  flex: 1;
  background: rgba(255, 255, 255, 0.98); 
  padding: 15px; 
  display: flex; 
  flex-direction: column; 
  gap: 12px; 
  overflow-y: auto; 
}

/* Right side - ads (2/3 of window) */
.ads-area { 
  width: 66.67%;
  background: #000; 
  position: relative; 
  overflow: hidden; 
}
.ad-content { 
  position: absolute; 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
  opacity: 0; 
  transition: opacity 1s ease-in-out; 
}
.ad-content.active { opacity: 1; }
.ad-caption { 
  position: absolute; 
  bottom: 0; 
  left: 0; 
  right:0; 
  background: rgba(0,0,0,0.7); 
  color: white; 
  padding: 15px; 
  text-align: center; 
  font-size: 1.5rem; 
  z-index: 10; 
}

/* Room card */
.room-card {
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  padding: 15px; 
  background: linear-gradient(145deg, #ffffff, #f8f9fa);
  border-radius: 12px; 
  border-left: 5px solid #1a73e8; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transition: all 0.3s; 
  height: 80px; 
  position: relative; 
  overflow: hidden;
}
.room-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.12); }
.room-info { display: flex; flex-direction: column; font-size: 1rem; flex: 1; }
.room-no { font-weight: bold; font-size: 1.2rem; color: #1a2a6c; margin-bottom: 5px; }
.doctor { font-style: italic; color: #666; font-size: 0.95rem; }

/* Token number */
.token { 
  font-weight: bold; 
  color: #1a73e8; 
  font-size: 2.8rem; 
  text-align: center; 
  min-width: 80px; 
  text-shadow: 1px 1px 3px rgba(0,0,0,0.1); 
  transition: all 0.3s; 
}

/* Recall badge */
.recall { 
  display: inline-block; 
  background: #ff4d4d; 
  color: white; 
  padding: 5px 12px; 
  border-radius: 20px; 
  font-weight: bold; 
  font-size: 0.9rem; 
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

/* Blink animations */
.pulse-next { animation: pulseNext 5s ease-in-out; border: 3px solid #ffcc00; }
@keyframes pulseNext { 
  0% { transform: scale(1); background-color: #fff9c4; }
  50% { transform: scale(1.05); background-color: #ffffff; }
  100% { transform: scale(1); background-color: #ffffff; }
}
.pulse-recall { animation: pulseRecall 5s ease-in-out; border: 3px solid #ff4d4d; }
@keyframes pulseRecall { 
  0% { transform: scale(1); background-color: #ffcdd2; }
  50% { transform: scale(1.05); background-color: #ffffff; }
  100% { transform: scale(1); background-color: #ffffff; }
}
.token-blink { animation: tokenBlink 1s ease-in-out; }
@keyframes tokenBlink {
  0%, 100% { color: #1a73e8; transform: scale(1); }
  50% { color: #ff6600; transform: scale(1.1); }
}

/* Audio control */
.audio-control { 
  position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; 
  border-radius: 50%; background: #1a73e8; color: white; border: none; 
  font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
  z-index: 1000; transition: all 0.3s; 
}
.audio-control:hover { transform: scale(1.1); }
.audio-control.muted { background:#ff4d4d; }

/* Overlay */
#startOverlay { 
  position: fixed; top:0; left:0; width:100%; height:100%; 
  background: rgba(0,0,0,0.92); color:white; display:flex; 
  flex-direction:column; justify-content:center; align-items:center; 
  font-size:2rem; text-align:center; z-index:2000; cursor:pointer; 
}
.overlay-content { max-width: 600px; padding: 30px; }
.overlay-content h2 { font-size: 3rem; margin-bottom: 20px; color: #1a73e8; }
.overlay-content p { font-size: 1.5rem; margin-bottom: 30px; }
.start-button { 
  background:#1a73e8; color:white; border:none; padding:15px 40px; 
  font-size:1.5rem; border-radius:50px; cursor:pointer; 
}
.start-button:hover { background: #1557b0; }

/* Responsive */
@media (max-width: 1024px) {
  .main-container { flex-direction: column; }
  .left-panel, .ads-area { width: 100%; }
  .token-area { height: 40vh; flex-direction: row; overflow-x: auto; padding: 10px; gap: 10px; }
  .room-card { min-width: 280px; height: 120px; }
  .ads-area { height: 60vh; }
}
@media (max-width: 768px) {
  .token { font-size: 2.2rem; }
  .room-no { font-size: 1.1rem; }
  .overlay-content h2 { font-size: 2.2rem; }
}
</style>
</head>
<body>

<!-- Start overlay -->
<div id="startOverlay">
  <div class="overlay-content">
    <h2>Hospital Token System</h2>
    <p>Click below to start the display and enable notification sounds</p>
    <button class="start-button">Start Display</button>
  </div>
</div>

<!-- Main content -->
<div class="main-container" id="mainContainer" style="display:none;">
  <div class="left-panel">
    <div class="banner-area">
      <div class="banner-container">
        <img src="LOGOFAROOK1.jpg" alt="Hospital Logo">
      </div>
    </div>
    <div class="token-area" id="displayArea"></div>
  </div>
  <div class="ads-area" id="adsArea"></div>
</div>

<button class="audio-control" id="audioToggle">🔊</button>
<audio id="notifSound" src="Ding.mp3" preload="auto"></audio>

<script>
const displayArea=document.getElementById("displayArea");
const notifSound=document.getElementById("notifSound");
const startOverlay=document.getElementById("startOverlay");
const mainContainer=document.getElementById("mainContainer");
const audioToggle=document.getElementById("audioToggle");

let previousTokens={};
let audioEnabled=false;
let db;

document.addEventListener('DOMContentLoaded',function(){
  if(typeof firebase!=='undefined' && firebase.apps.length>0){
    db=firebase.database();
    db.ref("tokens").on("value", snapshot=>updateDisplay(snapshot));
  }
});

document.querySelector('.start-button').addEventListener('click',()=>{
  startOverlay.style.display="none";
  mainContainer.style.display="flex";
  audioToggle.style.display="block";
  enableAudio();
});

audioToggle.addEventListener('click',()=>{
  audioEnabled=!audioEnabled;
  audioToggle.textContent=audioEnabled?"🔊":"🔇";
  audioToggle.classList.toggle('muted',!audioEnabled);
  if(audioEnabled) playNotificationSound();
});

function enableAudio(){
  const silentAudio=new Audio();
  silentAudio.src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA";
  silentAudio.volume=0;
  silentAudio.play().then(()=>{ audioEnabled=true; audioToggle.textContent="🔊"; }).catch(e=>{ audioEnabled=false; audioToggle.textContent="🔇"; audioToggle.classList.add('muted'); });
}

function playNotificationSound(){
  if(!audioEnabled) return;
  notifSound.currentTime=0; notifSound.play().catch(e=>console.log("Audio failed:",e));
}

function updateDisplay(snapshot){
  displayArea.innerHTML = '';
  
  if(!snapshot.exists()){
    displayArea.innerHTML += `
      <div class="room-card">
        <div class="room-info">
          <div class="room-no">No Active Tokens</div>
          <div class="doctor">Please wait for tokens</div>
        </div>
        <div class="token" style="font-size:1.5rem;">-</div>
      </div>`;
    return;
  }
  
  snapshot.forEach(roomSnap=>{
    const data=roomSnap.val();
    const card=document.createElement("div"); 
    card.className="room-card";
    
    let tokenFontSize="2.8rem";
    if(data.token>=10) tokenFontSize="2.4rem";
    if(data.token>=100) tokenFontSize="2rem";
    
    card.innerHTML=`
      <div class="room-info">
        <div class="room-no">Room ${data.roomNo}</div>
        <div class="doctor">Dr. ${data.doctor||'Available'}</div>
      </div>
      <div class="token" style="font-size:${tokenFontSize};">${data.token||0}</div>
      ${data.recall?'<span class="recall">Recall</span>':''}`;
    displayArea.appendChild(card);

    const tokenChanged = previousTokens[data.roomNo] === undefined || previousTokens[data.roomNo].token !== data.token;
    const recallActivated = data.recall && (previousTokens[data.roomNo] === undefined || !previousTokens[data.roomNo].recall);
    
    if(tokenChanged || recallActivated){
      playNotificationSound();
      if (data.recall) card.classList.add("pulse-recall");
      else card.classList.add("pulse-next");
      const tokenDiv = card.querySelector(".token");
      tokenDiv.classList.add("token-blink");
      setTimeout(()=>{ 
        card.classList.remove("pulse-next", "pulse-recall"); 
        tokenDiv.classList.remove("token-blink");
      }, 5000);
    }
    
    previousTokens[data.roomNo] = {
      token: data.token,
      recall: data.recall || false
    };
  });
}

// Ads
const ads = []; 
for (let i = 1; i <= 17; i++) {
  ads.push({src:`Slide${i}.jpg`,});
}
const adsArea=document.getElementById("adsArea");
ads.forEach((ad,index)=>{ 
  let el=document.createElement("img"); 
  el.className="ad-content"; 
  el.src=ad.src; 
  el.alt=ad.caption; 
  if(index===0) el.classList.add("active"); 
  adsArea.appendChild(el); 
  const caption=document.createElement("div"); 
  caption.className="ad-caption"; 
  caption.textContent=ad.caption; 
  caption.style.display=index===0?"block":"none"; 
  adsArea.appendChild(caption); 
});
let currentAd=0;
setInterval(()=>{ 
  const elements=adsArea.querySelectorAll(".ad-content"); 
  const captions=adsArea.querySelectorAll(".ad-caption"); 
  elements.forEach(el=>el.classList.remove("active")); 
  captions.forEach(cap=>cap.style.display="none"); 
  currentAd=(currentAd+1)%elements.length; 
  elements[currentAd].classList.add("active"); 
  captions[currentAd].style.display="block"; 
}, 6000);
</script>
</body>
</html>
