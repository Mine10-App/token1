<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Doctor Call Panel</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="fire.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    h2 { margin-bottom: 10px; }
    h3 { margin: 20px 0; }
    button { margin: 10px; padding: 10px 20px; font-size: 16px; }
    input { padding: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <h2 id="doctorInfo"></h2>
  <h3>Current Token: <span id="tokenNo">0</span></h3>

  <button onclick="nextToken()">Next Patient</button>
  <button onclick="recallToken()">Recall</button><br><br>

  <input type="number" id="manualToken" placeholder="Enter Token Number">
  <button onclick="manualCall()">Call Number</button><br><br>

  <button onclick="logout()">Logout</button>

  <script>
    let doctorName = localStorage.getItem("doctorName");
    let roomNo = localStorage.getItem("roomNo");

    if(!doctorName || !roomNo){
      window.location.href = "login.html"; // prevent direct access
    }

    document.getElementById("doctorInfo").innerText = 
      "Dr. " + doctorName + " (Room " + roomNo + ")";

    let tokenRef = firebase.database().ref("tokens/" + roomNo);

    // Keep current token live
    tokenRef.on("value", snapshot => {
      if(snapshot.exists()){
        document.getElementById("tokenNo").innerText = snapshot.val().token || 0;
      }
    });

    // Helper function: update Firebase
    function updateToken(newToken, recall=false){
      tokenRef.set({
        doctor: doctorName,
        roomNo: roomNo,
        token: newToken,
        recall: recall,
        updatedAt: Date.now()
      });
    }

    // Next patient
    function nextToken(){
      tokenRef.once("value").then(snapshot => {
        let data = snapshot.val();
        let newToken = (data && data.token) ? data.token + 1 : 1;
        updateToken(newToken, false);
      });
    }

    // Recall same patient
    function recallToken(){
      tokenRef.once("value").then(snapshot => {
        if(snapshot.exists()){
          let data = snapshot.val();
          updateToken(data.token, true);
        }
      });
    }

    // Manual call
    function manualCall(){
      let num = document.getElementById("manualToken").value;
      if(num){
        updateToken(parseInt(num), false);
      } else {
        alert("Please enter a token number.");
      }
    }

    // Logout
    function logout(){
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
